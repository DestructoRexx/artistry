<!DOCTYPE html>
<html lang="en" id="html-root" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Artistry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        if (localStorage.getItem('artistry_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-sans min-h-screen flex flex-col justify-center items-center py-8 sm:py-12 px-3 sm:px-4 overflow-x-hidden transition-colors duration-500">
    <div class="max-w-md w-full bg-white dark:bg-zinc-900 p-5 sm:p-8 rounded-2xl border border-zinc-200 dark:border-zinc-800 shadow-sm min-w-0">
        <div class="text-center mb-6 sm:mb-8 min-w-0">
            <h1 class="text-xl sm:text-2xl font-black uppercase tracking-widest text-indigo-600 dark:text-indigo-400 mb-2"><a href="/">Artistry</a></h1>
            <p class="text-zinc-500 dark:text-zinc-400 text-sm break-words">Create your new Artistry account.</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-800 rounded-xl text-rose-600 dark:text-rose-400 text-xs font-bold text-center break-words">
            {{ error }}
        </div>
        {% endif %}

        <form action="/api/auth/signup" method="post" class="space-y-5 min-w-0">
            <div class="min-w-0">
                <label class="block text-xs font-bold uppercase text-zinc-500 dark:text-zinc-400 mb-2 break-words">I am signing up as:</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                    <label class="border border-zinc-200 dark:border-zinc-800 rounded-xl p-3 flex items-center justify-center gap-2 cursor-pointer hover:border-indigo-600 transition min-w-0">
                        <input type="radio" name="role" value="artist" checked onclick="document.getElementById('studio_field').classList.remove('hidden')" class="shrink-0">
                        <span class="text-sm font-bold break-words">Artist</span>
                    </label>
                    <label class="border border-zinc-200 dark:border-zinc-800 rounded-xl p-3 flex items-center justify-center gap-2 cursor-pointer hover:border-indigo-600 transition min-w-0">
                        <input type="radio" name="role" value="buyer" onclick="document.getElementById('studio_field').classList.add('hidden')" class="shrink-0">
                        <span class="text-sm font-bold break-words">Buyer</span>
                    </label>
                </div>
            </div>

            <div id="studio_field" class="min-w-0">
                <label class="block text-xs font-bold uppercase text-zinc-500 dark:text-zinc-400 mb-1 break-words">Studio Brand Name</label>
                <input type="text" name="studio_name" placeholder="e.g. Alex Creations" class="w-full min-w-0 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600">
            </div>

            <div class="min-w-0">
                <label class="block text-xs font-bold uppercase text-zinc-500 dark:text-zinc-400 mb-1 break-words">Email Address</label>
                <input type="email" name="email" required placeholder="artist@artistry.com" class="w-full min-w-0 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600">
            </div>

            <div class="min-w-0">
                <label class="block text-xs font-bold uppercase text-zinc-500 dark:text-zinc-400 mb-1 break-words">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full min-w-0 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600">
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-500 transition shadow-sm cursor-pointer break-words">
                Create Account →
            </button>
        </form>

        <p class="text-center text-xs text-zinc-500 dark:text-zinc-400 mt-6 break-words">
            Already have an account? <a href="/login" class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline">Log in here</a>
        </p>
    </div>
</body>
</html>
